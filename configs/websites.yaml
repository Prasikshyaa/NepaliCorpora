# config/websites.yaml
# Production-grade Nepali news website configuration
# YAML defines WHAT to crawl, crawler defines HOW

sites:

  # ============================================================================
  # 1. ONLINE KHABAR
  # ============================================================================
  onlinekhabar:
    base_url: https://www.onlinekhabar.com
    start_urls:
      - https://www.onlinekhabar.com/
      - https://www.onlinekhabar.com/content/news
      - https://www.onlinekhabar.com/content/news/rastiya
      - https://www.onlinekhabar.com/business
      - https://www.onlinekhabar.com/markets
      - https://www.onlinekhabar.com/health/
      - https://www.onlinekhabar.com/lifestyle/
      - https://www.onlinekhabar.com/content/technology-news
      - https://www.onlinekhabar.com/entertainment
      - https://www.onlinekhabar.com/sports
      - https://www.onlinekhabar.com/opinion
      - https://www.onlinekhabar.com/rashifal

    allowed_domains:
      - onlinekhabar.com
      - www.onlinekhabar.com
      - calendar.onlinekhabar.com

    article_patterns:
      - "/\\d{4}/\\d{2}/\\d{7}/"
      - "/\\d{4}/\\d{2}/\\d{6}/"
      - "/news/\\d+"

    exclude_patterns:
      - "/author/"
      - "/tag/"
      - "/search"
      - "/login"
      - "/register"
      - "/epaper"
      - "#"

    user_agent: "NepaliCorpusBot/1.0 (Nepali NLP Research; prasikshyakarki@gmail.com)"
    requires_javascript: false
    max_depth: 6
    rate_limit_seconds: 2
    respect_robots_txt: false


